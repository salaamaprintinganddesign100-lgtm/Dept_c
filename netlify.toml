# Frontend on Netlify — browser calls /api on same site
# Netlify proxies /api → Vercel (avoids browser timeout to vercel.app)

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin API via proxy below (do NOT set Vercel URL in VITE_API_URL)
  VITE_API_URL = "/api"

# Proxy API to Vercel backend (must be BEFORE SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "https://dept-c-o3xu.vercel.app/api/:splat"
  status = 200
  force = true

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
